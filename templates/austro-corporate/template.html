<table
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="font-family: Arial, Helvetica, sans-serif; color: #11213a; line-height: 1.35"
>
  <tr>
    <td style="padding-right: 16px; vertical-align: top">
      <img
        src="{{logoUrl}}"
        width="160"
        alt="{{company}}"
        style="display: block; border: 0; outline: none; text-decoration: none"
      />
    </td>
    <td style="border-left: 2px solid #005a9c; padding-left: 16px; vertical-align: top">
      <p style="margin: 0; font-size: 16px; font-weight: bold; color: #11213a">{{name}}</p>
      <p style="margin: 2px 0 8px; font-size: 13px; color: #1b4772">{{title}}</p>
      <p style="margin: 0; font-size: 12px"><strong>{{company}}</strong></p>
      <p style="margin: 2px 0; font-size: 12px">
        T: <a href="tel:{{phone}}" style="color: #005a9c; text-decoration: none">{{phone}}</a>
      </p>
      <p style="margin: 2px 0; font-size: 12px">
        E: <a href="mailto:{{email}}" style="color: #005a9c; text-decoration: none">{{email}}</a>
      </p>
      <p style="margin: 2px 0; font-size: 12px">
        W: <a href="{{website}}" style="color: #005a9c; text-decoration: none">{{website}}</a>
      </p>
    </td>
  </tr>
</table>
{{#if __include_disclaimer}} {{#if disclaimer}}
<p
  style="
    margin: 8px 0 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    color: #c53030;
    line-height: 1.35;
  "
>
  {{disclaimer}}
</p>
{{/if}} {{/if}} {{#if __include_bannerUrl}} {{#if bannerUrl}}
<img
  src="{{bannerUrl}}"
  width="620"
  alt="Campaign banner"
  style="
    display: block;
    width: 100%;
    max-width: 620px;
    margin-top: 8px;
    border: 0;
    outline: none;
    text-decoration: none;
    border-radius: 8px;
  "
/>
{{/if}} {{/if}}
