<table
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="font-family: Arial, Helvetica, sans-serif; color: #0f2438; line-height: 1.4"
>
  <tr>
    <td style="vertical-align: top; padding-right: 14px">
      <p style="margin: 0; font-size: 15px; font-weight: bold">{{name}}</p>
      <p style="margin: 2px 0 8px; font-size: 12px; color: #2e6f8f">{{title}} | {{company}}</p>
      <p style="margin: 0; font-size: 12px">
        <a href="mailto:{{email}}" style="color: #0f2438; text-decoration: none">{{email}}</a>
      </p>
      <p style="margin: 2px 0; font-size: 12px">
        <a href="tel:{{phone}}" style="color: #0f2438; text-decoration: none">{{phone}}</a>
      </p>
      <p style="margin: 2px 0; font-size: 12px">
        <a href="{{website}}" style="color: #2e6f8f; text-decoration: none">{{website}}</a>
      </p>
    </td>
    <td style="width: 1px; background: #2e6f8f"></td>
    <td style="vertical-align: middle; padding-left: 14px">
      <img src="{{logoUrl}}" width="140" alt="{{company}}" style="display: block; border: 0" />
    </td>
  </tr>
</table>
